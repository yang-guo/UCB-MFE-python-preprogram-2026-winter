[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Starlette 1.x warns that its TestClient will move from httpx to httpx2; the course
# template pins httpx 0.28.1, so this warning is expected and not about this code.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
