[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 96
target-version = "py312"
# Unmodified copy of Lectures/modeling/course_data.py (kept identical for unpickling).
extend-exclude = ["course_data.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
