name: Lesson 9 checks
on:
  pull_request:
    paths:
      - 'Lectures/Lecture 9/demo/**'
      - '.github/workflows/lesson-9.yml'
  push:
    paths:
      - 'Lectures/Lecture 9/demo/**'
      - '.github/workflows/lesson-9.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lectures/Lecture 9/demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.6.14
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -q
