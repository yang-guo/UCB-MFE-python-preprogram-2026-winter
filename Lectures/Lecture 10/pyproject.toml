[project]
name = "mfe-stock-research-harness"
version = "0.1.0"
description = "Lecture 10: stock research with Pydantic AI Harness"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-harness[anthropic]==0.65.0",
    "pydantic-ai-slim==2.65.0",
    "numpy==2.5.4",
    "pandas==3.1.0",
]

[tool.uv]
package = false

[dependency-groups]
notebook = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
