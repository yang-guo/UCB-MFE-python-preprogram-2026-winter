[project]
name = "mfe-lesson-9"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "scikit-learn>=1.6,<2", "numpy>=2,<3", "joblib>=1.4,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "jupyterlab>=4,<5", "nbclient>=0.10,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 96
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
